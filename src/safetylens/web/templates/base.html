<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SafetyLens{% endblock %}</title>
  <link rel="stylesheet" href="/static/pico.min.css">
  <style>
    .chart { width: 100%; min-height: 120px; }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { display: inline; }
    .narrative { white-space: pre-wrap; }
    footer small { color: var(--pico-muted-color); }
  </style>
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><a href="/"><strong>SafetyLens</strong></a></li></ul>
      <ul><li><small>Plain-English answers from NHTSA complaints and recalls</small></li></ul>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="container">
    <hr>
    <p id="disclaimer"><small>{{ disclaimer }}</small></p>
  </footer>
  <script src="/static/htmx.min.js"></script>
  <script src="/static/vega.min.js"></script>
  <script src="/static/vega-lite.min.js"></script>
  <script src="/static/vega-embed.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
