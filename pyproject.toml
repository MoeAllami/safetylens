[project]
name = "safetylens"
version = "0.1.0"
description = "Plain-English answers about NHTSA complaints and recalls, cited to real records."
readme = "README.md"
authors = [
    { name = "MoeAllami", email = "143964025+MoeAllami@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3.0",
    "anthropic>=2.1.0",
    "duckdb>=2.0.0",
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "sentence-transformers>=6.2.0",
    "structlog>=26.1.0",
    "torch>=2.14.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
safetylens = "safetylens.cli:app"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.10.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

# torch: CUDA build on the Windows dev machine (GPU embeddings), small CPU build on Linux CI.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # lets every test import the shared tests/builders.py
addopts = "--strict-markers -m 'not e2e'"  # browser tests run only via make e2e
markers = [
    "slow: large data or model work, skipped by make test-fast",
    "network: needs the live NHTSA or Anthropic API, skipped by make test-fast",
    "idempotent: re-running ingest must give identical row counts and checksums",
    "e2e: drives the web app in a real browser (Playwright); run with make e2e",
]

[tool.coverage.run]
source = ["safetylens"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
